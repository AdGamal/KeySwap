name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test and build
        run: ./mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KeySwap-mac
          path: mac/build/KeySwap-mac.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test (with the real Windows Arabic and US layouts) and build
        shell: cmd
        run: windows\build.bat --real-layouts
      - uses: actions/upload-artifact@v4
        with:
          name: KeySwap-windows
          path: windows/build/KeySwap.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KeySwap-mac.zip
            dist/KeySwap.exe
